name: Build Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # تثبيت الحزم
      - name: Install Dependencies
        run: npm install

      # بناء المشروع
      - name: Build Project
        run: npm run build

      # ضغط ملفات dist
      - name: Create dist archive
        run: |
          zip -r dist.zip dist

      # رفع ملفات البناء
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist.zip
          retention-days: 30

name: Build Hakeem Clinic Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          unzip -o hakeem-clinic-php-backend.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Detect Frontend Directory
        run: |
          FRONTEND_DIR=$(find project -name package.json -exec grep -l '"build": "vite build"' {} \; | xargs dirname)
          echo "FRONTEND_DIR=$FRONTEND_DIR" >> $GITHUB_ENV
          echo "Frontend found at: $FRONTEND_DIR"

      - name: Install Dependencies
        run: |
          cd "$FRONTEND_DIR"
          npm install

      - name: Build Project
        run: |
          cd "$FRONTEND_DIR"
          npm run build

      - name: Zip dist
        run: |
          cd "$FRONTEND_DIR"
          zip -r ../../hakeem-clinic-dist.zip dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: hakeem-clinic-dist
          path: hakeem-clinic-dist.zip

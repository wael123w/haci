name: Build Hakeem Clinic Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # تحميل ملفات GitHub
      - name: Checkout Repository
        uses: actions/checkout@v5


      # فك ضغط المشروع
      - name: Extract Project ZIP
        run: |
          unzip -o hakeem-clinic-php-backend.zip -d project
          echo "Project extracted"
          find project -maxdepth 3 -name package.json


      # إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22


      # العثور على مشروع React الصحيح
      - name: Detect Frontend Directory
        run: |
          FRONTEND_DIR=$(find project -name package.json -exec grep -l '"build": "vite build"' {} \; | xargs dirname)

          if [ -z "$FRONTEND_DIR" ]; then
            echo "Frontend project not found"
            exit 1
          fi

          echo "Frontend directory:"
          echo "$FRONTEND_DIR"

          echo "FRONTEND_DIR=$FRONTEND_DIR" >> $GITHUB_ENV


      # تثبيت الحزم
      - name: Install Dependencies
        run: |
          cd "$FRONTEND_DIR"
          npm install


      # بناء المشروع
      - name: Build Vite Project
        run: |
          cd "$FRONTEND_DIR"
          npm run build


      # التحقق من ملفات البناء
      - name: Check Build Files
        run: |
          echo "Searching dist folder..."
          find project -type d -name dist
          find project -type f -name index.html


      # إنشاء ملف ZIP الصحيح
      - name: Create dist Archive
        run: |
          echo "Finding generated index.html..."

          DIST_DIR=$(find project -type f -name index.html | head -1 | xargs dirname)

          if [ -z "$DIST_DIR" ]; then
            echo "dist folder not found"
            exit 1
          fi

          echo "Using dist folder:"
          echo "$DIST_DIR"

          cd "$DIST_DIR"

          zip -r "$GITHUB_WORKSPACE/hakeem-clinic-dist.zip" .

          echo "Created ZIP:"
          ls -lh "$GITHUB_WORKSPACE/hakeem-clinic-dist.zip"


      # رفع ملف الإنتاج
      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: hakeem-clinic-dist
          path: hakeem-clinic-dist.zip
          retention-days: 30

name: Build Hakeem Clinic Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # تحميل المشروع
      - name: Checkout Repository
        uses: actions/checkout@v5


      # فك ضغط ملف ZIP
      - name: Extract Project ZIP
        run: |
          unzip -o hakeem-clinic-php-backend.zip -d project
          echo "ZIP extracted"


      # إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22


      # العثور على مشروع React
      - name: Detect Frontend Directory
        run: |
          FRONTEND_DIR=$(find project -name package.json -exec grep -l '"build": "vite build"' {} \; | xargs dirname)

          if [ -z "$FRONTEND_DIR" ]; then
            echo "React project not found"
            exit 1
          fi

          echo "Frontend found:"
          echo "$FRONTEND_DIR"

          echo "FRONTEND_DIR=$FRONTEND_DIR" >> $GITHUB_ENV


      # تثبيت الحزم
      - name: Install Dependencies
        run: |
          cd "$FRONTEND_DIR"
          npm install


      # بناء Vite
      - name: Build Project
        run: |
          cd "$FRONTEND_DIR"
          npm run build


      # عرض مكان dist للتأكد
      - name: Check Build Output
        run: |
          echo "Searching index.html..."
          find project -name index.html

          echo "Searching dist folders..."
          find project -type d -name dist


      # إنشاء ZIP الصحيح
      - name: Create Production ZIP
        run: |
          echo "Finding final dist..."

          DIST_DIR=$(find project -name index.html | head -1 | xargs dirname)

          if [ -z "$DIST_DIR" ]; then
            echo "No dist output found"
            exit 1
          fi

          echo "Using:"
          echo "$DIST_DIR"

          cd "$DIST_DIR"

          zip -r "$GITHUB_WORKSPACE/hakeem-clinic-dist.zip" .

          echo "ZIP size:"
          ls -lh "$GITHUB_WORKSPACE/hakeem-clinic-dist.zip"


      # رفع الملف
      - name: Upload Production Files
        uses: actions/upload-artifact@v5
        with:
          name: hakeem-clinic-dist
          path: hakeem-clinic-dist.zip
          retention-days: 30

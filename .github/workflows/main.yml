name: Build Hakeem Clinic Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # تحميل الكود من GitHub
      - name: Checkout Repository
        uses: actions/checkout@v5


      # فك ضغط المشروع
      - name: Extract Project ZIP
        run: |
          unzip -o assets.zip -d project
          echo "Project extracted"


      # إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22


      # البحث عن مشروع Vite React
      - name: Detect Frontend Directory
        run: |

          FRONTEND_DIR=$(find project \
          -name package.json \
          -exec grep -l '"vite build"' {} \; \
          | head -1 \
          | xargs dirname)

          if [ -z "$FRONTEND_DIR" ]; then
            echo "No Vite React project found"
            exit 1
          fi

          echo "Frontend found:"
          echo "$FRONTEND_DIR"

          echo "FRONTEND_DIR=$FRONTEND_DIR" >> $GITHUB_ENV


      # تثبيت المكتبات
      - name: Install Dependencies
        run: |
          cd "$FRONTEND_DIR"
          npm install


      # بناء المشروع
      - name: Build React Project
        run: |
          cd "$FRONTEND_DIR"
          npm run build


      # التأكد من وجود dist
      - name: Check dist
        run: |
          echo "Checking dist folder..."
          ls -la "$FRONTEND_DIR/dist"


      # إنشاء ملف الرفع
      - name: Create Production ZIP
        run: |

          cd "$FRONTEND_DIR"

          if [ ! -d "dist" ]; then
            echo "dist folder missing"
            exit 1
          fi

          zip -r "$GITHUB_WORKSPACE/hakeem-clinic-dist.zip" dist

          echo "Created:"
          ls -lh "$GITHUB_WORKSPACE/hakeem-clinic-dist.zip"


      # رفع الملف النهائي
      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v5
        with:
          name: hakeem-clinic-dist
          path: hakeem-clinic-dist.zip
          retention-days: 30

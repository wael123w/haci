name: Build Hakeem Clinic Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          unzip -o hakeem-clinic-php-backend.zip -d project
          find project -name package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd $(dirname $(find project -name package.json | head -1))
          npm install

      - name: Build Vite Project
        run: |
          cd $(dirname $(find project -name package.json | head -1))
          npm run build

      - name: Create dist ZIP
        run: |
          DIST_PATH=$(dirname $(find project -type d -name dist | head -1))
          cd "$DIST_PATH"
          zip -r ../../../hakeem-clinic-dist.zip dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: hakeem-clinic-dist
          path: hakeem-clinic-dist.zip
          retention-days: 30
